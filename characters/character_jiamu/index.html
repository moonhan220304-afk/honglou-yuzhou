a\",\"event_qingxuguan_ch29\"]},{\"dimension\":\"精明周全\",\"description\":\"历经三代的大家主母，人情世故通达，疼爱之下不失家主的判断与分寸。\",\"evidence_events\":[\"event_qingxuguan_ch29\"]},{\"dimension\":\"护短溺爱\",\"description\":\"对宝玉的爱护到了「不教而纵」的地步，挨打时亲赴书房救场，贾政也无可如何。\",\"evidence_events\":[\"event_baoyu_beaten_ch33\"]}],\"timeline\":[{\"order\":1,\"event_id\":\"event_daiyu_enters_jia\",\"title\":\"接外孙女黛玉进京（第三回）\"},{\"order\":2,\"event_id\":\"event_qingxuguan_ch29\",\"title\":\"清虚观打醮（第二十九回）\"},{\"order\":3,\"event_id\":\"event_baoyu_beaten_ch33\",\"title\":\"宝玉挨打救场（第三十三回）\"}],\"related_characters\":[{\"character_id\":\"character_lin_daiyu\",\"relationship_type\":\"祖孙怜爱\"},{\"character_id\":\"character_jia_baoyu\",\"relationship_type\":\"祖孙\"}],\"sources\":[{\"source_id\":\"source_ch29_qingxuguan\",\"quote\":\"贾母方说：「你们又来做什么，我不过没事来逛逛。」\",\"note\":\"第二十九回清虚观打醮，贾母随口家常语。\"}],\"status\":{\"review\":\"verified\",\"confidence\":100,\"verified_by\":\"redmansion-kb-v1\",\"updated_at\":\"2026-08-10T00:00:00Z\",\"embedding_status\":\"pending\"}},\"timelineEvents\":[{\"order\":1,\"event_id\":\"event_daiyu_enters_jia\",\"title\":\"接外孙女黛玉进京（第三回）\",\"event\":{\"id\":\"event_daiyu_enters_jia\",\"title\":\"黛玉进贾府\",\"event_level\":\"major\",\"chapter\":{\"number\":3,\"title\":\"贾雨村夤缘复旧职 林黛玉抛父进京都\",\"attribution\":\"caoxueqin\"},\"location\":{\"name\":\"荣国府\",\"specific\":\"从西角门入，至贾母正房大院。先后拜见贾母、邢夫人、王夫人、王熙凤及迎探惜三春。\"},\"summary\":{\"short\":\"黛玉十岁丧母后投奔外祖母贾母，初入荣国府，一一拜见各色人物。与宝玉初次见面，彼此都有「旧时相识」之感。宝玉问「可有玉没有」，闻无玉即摔玉。\",\"meaning\":[\"黛玉身世由姑苏到京城的场景转换，正式进入贾府叙事核心\",\"步步留心、时时在意，刻画黛玉寄人篱下的心理起点\",\"宝黛初见——前世神话照进今生现实，奠定全书爱情主线\",\"摔玉事件——宝玉对「金玉良缘」的第一次无意识抵抗\"]},\"participants\":[{\"character_id\":\"character_lin_daiyu\",\"role\":\"主角（初入贾府）\"},{\"character_id\":\"character_jia_baoyu\",\"role\":\"初次见面，摔玉\"},{\"character_id\":\"character_wang_xifeng\",\"role\":\"出场迎接，先声夺人\"}],\"evidence\":[{\"source_id\":\"source_ch03_first_meet\",\"quote\":\"黛玉一见，便吃一大惊，心下想道：「好生奇怪，倒像在那里见过一般，何等眼熟到如此！」\",\"note\":\"第三回宝黛初次见面时黛玉的心理活动。\"}],\"interpretations\":[{\"type\":\"literary\",\"title\":\"神话照进现实\",\"content\":\"宝黛「似曾相识」的第一眼，是前八十回最精妙的宿命暗示。前世绛珠仙草与神瑛侍者的关系在今生第一面便以直觉的方式复现，曹雪芹以此将世俗小说提升至神话高度。\"},{\"type\":\"character\",\"title\":\"黛玉性格的起点\",\"content\":\"黛玉「步步留心，时时在意，不肯轻易多说一句话，多行一步路」的叙述，精准奠定其寄人篱下的心理基调。此后一切敏感、多疑、尖刻，均由此生发。\"}],\"related_events\":[\"event_baoyu_smash_jade_ch3\"],\"status\":{\"review\":\"verified\",\"confidence\":100,\"verified_by\":\"kb-agent-v2\",\"updated_at\":\"2026-08-10T00:00:00Z\",\"embedding_status\":\"pending\"}}},{\"order\":2,\"event_id\":\"event_qingxuguan_ch29\",\"title\":\"清虚观打醮（第二十九回）\",\"event\":{\"id\":\"event_qingxuguan_ch29\",\"title\":\"清虚观打醮\",\"event_level\":\"minor\",\"chapter\":{\"number\":29,\"title\":\"享福人福深还祷福 痴情女情重愈斟情\",\"attribution\":\"caoxueqin\"},\"location\":{\"name\":\"清虚观\",\"specific\":\"道观正殿\"},\"summary\":{\"short\":\"贾母率阖府女眷至清虚观打平安醮，张道士为宝玉提亲，宝黛因此又生口角。\",\"meaning\":[\"贾府贵族生活的盛景写照\",\"张道士提亲，是金玉良缘与宝黛之情的第一次公开交锋\",\"贾母当众表态度，为后文宝黛关系的走向埋下伏笔\"]},\"participants\":[{\"character_id\":\"character_jiamu\",\"role\":\"主持者\"},{\"character_id\":\"character_lin_daiyu\",\"role\":\"参与者\"},{\"character_id\":\"character_jia_baoyu\",\"role\":\"参与者\"}],\"evidence\":[{\"source_id\":\"source_ch29_qingxuguan\",\"quote\":\"贾母方说：「你们又来做什么，我不过没事来逛逛。」\",\"note\":\"第二十九回清虚观打醮。\"}],\"interpretations\":[],\"related_events\":[\"event_daiyu_enters_jia\"],\"status\":{\"review\":\"verified\",\"confidence\":100,\"verified_by\":\"redmansion-kb-v1\",\"updated_at\":\"2026-08-10T00:00:00Z\",\"embedding_status\":\"pending\"}}},{\"order\":3,\"event_id\":\"event_baoyu_beaten_ch33\",\"title\":\"宝玉挨打救场（第三十三回）\",\"event\":{\"id\":\"event_baoyu_beaten_ch33\",\"title\":\"宝玉挨打\",\"event_level\":\"major\",\"chapter\":{\"number\":33,\"title\":\"手足耽耽小动唇舌 不肖种种大承笞挞\",\"attribution\":\"caoxueqin\"},\"location\":{\"name\":\"荣国府\",\"specific\":\"贾政书房\"},\"summary\":{\"short\":\"因金钏之死与琪官之事，贾政大怒，将宝玉打得动弹不得。王夫人赶来抱住板子哭劝，贾母赶到后方才罢休。\",\"meaning\":[\"宝玉反叛性格与父权秩序最激烈的一次正面冲突\",\"王夫人哭诉中提及贾珠，母子隔膜的深层根源在此\",\"宝黛感情由此得到公开的确认与同情\"]},\"participants\":[{\"character_id\":\"character_jia_baoyu\",\"role\":\"被打者\"},{\"character_id\":\"character_wangfuren\",\"role\":\"护子者\"},{\"character_id\":\"character_jiamu\",\"role\":\"最终救场者\"}],\"evidence\":[{\"source_id\":\"source_ch33_wangfuren_cry\",\"quote\":\"王夫人哭道：「宝玉虽然该打，老爷也要自重。况且炎天暑日的，老太太身上也不大好，打死宝玉事小，倘或老太太一时不自在了，岂不事大！」\",\"note\":\"第三十三回王夫人哭劝贾政。\"}],\"interpretations\":[{\"type\":\"literary\",\"title\":\"全书情绪的爆点\",\"content\":\"此回是前八十回中家庭冲突最剧烈的一场，宝玉挨打牵连出金钏之死、忠顺王府索人、贾环进谗等多条线索，是家族内部矛盾的集中爆发。\"}],\"related_events\":[\"event_heartfelt_words_ch32\",\"event_gift_handkerchief_ch34\"],\"status\":{\"review\":\"verified\",\"confidence\":100,\"verified_by\":\"redmansion-kb-v1\",\"updated_at\":\"2026-08-10T00:00:00Z\",\"embedding_status\":\"pending\"}}}],\"relations\":[{\"id\":\"relationship_jiamu_lin_daiyu\",\"from\":\"character_jiamu\",\"to\":\"character_lin_daiyu\",\"type\":\"祖孙\",\"nature\":[\"kinship\"],\"direction\":\"one-way\",\"summary\":\"贾母对丧母的外孙女黛玉怜爱有加，接她进京亲自抚养，与宝玉同住碧纱橱内外，视若己出。\",\"stages\":[{\"stage\":1,\"title\":\"接外孙女\",\"chapter\":3,\"description\":\"黛玉丧母，贾母派人接她进京，亲自抚养，「万般怜爱」。\"}],\"evidence_events\":[{\"event_id\":\"event_daiyu_enters_jia\",\"description\":\"黛玉进贾府\"}],\"impact\":\"贾母的宠爱是黛玉在贾府的立身之本；而她最终在宝黛婚姻上的沉默，也预示了黛玉依靠的脆弱性。\",\"status\":{\"review\":\"verified\",\"confidence\":100,\"verified_by\":\"redmansion-kb-v1\",\"updated_at\":\"2026-08-10T00:00:00Z\",\"embedding_status\":\"pending\"}},{\"id\":\"relationship_jia_mu_lin_daiyu\",\"from\":\"character_jiamu\",\"to\":\"character_lin_daiyu\",\"type\":\"祖孙（外祖母与外孙女）\",\"nature\":[\"kinship\"],\"direction\":\"mutual\",\"summary\":\"贾母对黛玉既怜又爱，是黛玉在贾府最重要的庇护力量。黛玉初入贾府时贾母「心肝儿肉」般大哭抱住；前期安排黛玉与宝玉同住碧纱橱，形同「默许」；然而在宝玉婚姻大事上最终背弃黛玉、选择宝钗。这一转变是全书最令人心碎的亲情变奏。\",\"stages\":[{\"stage\":1,\"title\":\"痛失爱女——疼爱外孙\",\"chapter\":3,\"description\":\"黛玉初入贾府，贾母「早有许多盛妆丽服之姬妾丫鬟迎着」，一见面便「一把搂入怀中，心肝儿肉叫着大哭起来」。此后安排黛玉入碧纱橱与宝玉同住。\"},{\"stage\":2,\"title\":\"庇护与疏远\",\"chapter\":54,\"description\":\"元宵家宴上贾母对黛玉的宠爱仍可见，但随着黛玉年纪增长和宝钗的出现，贾母的态度逐渐微妙。这反映了贾母作为家族首脑在感情与利益之间的挣扎。\"},{\"stage\":3,\"title\":\"舍弃黛玉——选择宝钗\",\"chapter\":96,\"description\":\"贾母在家族利益考量下，同意以掉包计让宝玉迎娶宝钗，直接导致黛玉的死亡。\",\"note\":\"后四十回，attribution=gaoe。前八十回贾母对黛玉的态度是否有此转变，红学界存在重大争议。\"}],\"evidence_events\":[{\"event_id\":\"event_daiyu_enters_jia\",\"description\":\"贾母初见黛玉——祖孙情深\"}],\"impact\":\"贾母对黛玉的态度变化，是全书中最残酷的亲情反讽。贾母先因疼爱女儿贾敏而怜爱黛玉，最终又因疼爱孙子宝玉而舍弃黛玉——两个「疼爱」之间，黛玉成了牺牲品。\",\"status\":{\"review\":\"verified\",\"confidence\":100,\"verified_by\":\"kb-agent-v2\",\"updated_at\":\"2026-08-10T00:00:00Z\",\"embedding_status\":\"pending\"}},{\"id\":\"relationship_jia_mu_jia_yuanchun\",\"from\":\"character_jiamu\",\"to\":\"character_jia_yuanchun\",\"type\":\"祖孙（祖母与长孙女）\",\"nature\":[\"kinship\"],\"direction\":\"mutual\",\"summary\":\"元春省亲时见到贾母，「满眼垂泪……一手搀贾母一手搀王夫人，三个人满心里皆有许多话，只是俱说不出，只管呜咽对泣」。祖母向孙女以国礼跪拜——封建皇权对家庭伦理最彻底的反转。\",\"stages\":[{\"stage\":1,\"title\":\"省亲相泣\",\"chapter\":18,\"description\":\"元宵之夜，贾母以国礼跪迎孙女——祖母向孙女跪拜，这是封建皇权对家庭伦理最彻底的反转。\"}],\"evidence_events\":[{\"event_id\":\"event_yuanchun_homecoming_ch18\",\"description\":\"省亲时与贾母对泣\"}],\"impact\":\"元春与贾母的关系集中体现了《红楼梦》对封建伦理的批判——皇权将祖母与孙女的关系倒转为君臣，让血缘中最自然的亲情被政治体制扭曲为最不自然的礼仪。\",\"status\":{\"review\":\"verified\",\"confidence\":100,\"verified_by\":\"kb-agent-v2\",\"updated_at\":\"2026-08-10T00:00:00Z\",\"embedding_status\":\"pending\"}}],\"viewpoints\":[],\"questions\":[]}]}]\nb:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n10:I[27201,[\"/_next/static/chunks/3hkbun0grg2v7.js\",\"/_next/static/chunks/19dj7h0a4hfs2.js\"],\"IconMark\"]\n8:null\nd:[[\"$\",\"title\",\"0\",{\"children\":\"贾母 · 红楼宇宙\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"贾府的最高权威，慈爱而精明，最疼爱宝玉与黛玉。\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L10\",\"3\",{}]]\n"])</script></body></html>
