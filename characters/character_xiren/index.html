ce_id\":\"source_ch06_xiren_tou\",\"quote\":\"袭人素知贾母已将自己与了宝玉的，今便如此，亦不为越礼，遂和宝玉偷试一番，幸得无人撞见。\",\"note\":\"第六回初试云雨情，袭人身份自此而变。\"}],\"status\":{\"review\":\"verified\",\"confidence\":100,\"verified_by\":\"redmansion-kb-v1\",\"updated_at\":\"2026-08-10T00:00:00Z\",\"embedding_status\":\"pending\"}},\"timelineEvents\":[{\"order\":1,\"event_id\":\"event_chuyun_ch6\",\"title\":\"初试云雨情（第六回）\",\"event\":{\"id\":\"event_chuyun_ch6\",\"title\":\"初试云雨情\",\"event_level\":\"minor\",\"chapter\":{\"number\":6,\"title\":\"贾宝玉初试云雨情 刘姥姥一进荣国府\",\"attribution\":\"caoxueqin\"},\"location\":{\"name\":\"怡红院\",\"specific\":\"宝玉卧房\"},\"summary\":{\"short\":\"宝玉梦游太虚幻境后，与贴身丫鬟袭人偷试云雨。自此袭人待宝玉更为尽心，成为事实上的侍妾。\",\"meaning\":[\"袭人身份的转折点——自此自视为宝玉之人\",\"宝玉与身边女性的情感世界由此展开\"]},\"participants\":[{\"character_id\":\"character_jia_baoyu\",\"role\":\"主要人物\"},{\"character_id\":\"character_xiren\",\"role\":\"主要人物\"}],\"evidence\":[{\"source_id\":\"source_ch06_xiren_tou\",\"quote\":\"袭人素知贾母已将自己与了宝玉的，今便如此，亦不为越礼，遂和宝玉偷试一番，幸得无人撞见。\",\"note\":\"第六回初试云雨情。\"}],\"interpretations\":[],\"related_events\":[\"event_daiyu_enters_jia\"],\"status\":{\"review\":\"verified\",\"confidence\":100,\"verified_by\":\"redmansion-kb-v1\",\"updated_at\":\"2026-08-10T00:00:00Z\",\"embedding_status\":\"pending\"}}},{\"order\":2,\"event_id\":\"event_quan_baoyu_ch19\",\"title\":\"情切切良宵花解语（第十九回）\",\"event\":{\"id\":\"event_quan_baoyu_ch19\",\"title\":\"情切切良宵花解语\",\"event_level\":\"minor\",\"chapter\":{\"number\":19,\"title\":\"情切切良宵花解语 意绵绵静日玉生香\",\"attribution\":\"caoxueqin\"},\"location\":{\"name\":\"怡红院\",\"specific\":\"袭人房中\"},\"summary\":{\"short\":\"袭人借赎身之说试探宝玉，规劝他读书上进、不可毁僧谤道、改掉爱红的毛病，提出「三不许」。\",\"meaning\":[\"「贤袭人」之贤的集中体现\",\"袭人的规劝与宝玉的叛逆形成深层隔膜\"]},\"participants\":[{\"character_id\":\"character_xiren\",\"role\":\"主要人物\"},{\"character_id\":\"character_jia_baoyu\",\"role\":\"主要人物\"}],\"evidence\":[],\"interpretations\":[],\"related_events\":[\"event_chuyun_ch6\"],\"status\":{\"review\":\"verified\",\"confidence\":100,\"verified_by\":\"redmansion-kb-v1\",\"updated_at\":\"2026-08-10T00:00:00Z\",\"embedding_status\":\"pending\"}}}],\"relations\":[],\"viewpoints\":[],\"questions\":[{\"id\":\"question_wangfuren_banish_qingwen\",\"title\":\"王夫人为什么赶走晴雯？\",\"heat_weight\":84,\"viewpoints\":[{\"id\":\"viewpoint_qingwen_ritual_defense\",\"title\":\"礼教防卫：晴雯触碰了王夫人的底线\",\"summary\":\"王夫人对「狐媚子」的恐惧是结构性的——她最怕丫鬟勾引宝玉坏其名声与功名。晴雯的「轻狂样」是导火索，但根本原因在于王夫人的「风化焦虑」。\",\"argument_body\":\"王夫人一生的执念是保护宝玉的「声名品行」。第三十回金钏因一句玩笑被她逐出并投井而死，第三十六回她提升袭人的月钱并秘密托付她「好歹留心」，都是同一逻辑：宝玉身边必须是「沉重知大礼」的丫鬟。晴雯恰好是这种标准的反面：模样好（「眉眼又有些像你林妹妹」）、性高傲、不奉承、且直接撞上王夫人巡视时的「轻狂样」。王善保家的告状之所以一击即中，正因为它精确命中了王夫人最深的恐惧——一个像黛玉的、美丽的、不受控制的丫鬟，会毁掉宝玉。\",\"stance_type\":\"pro_ritual_defense\",\"fact_type\":\"text_inference\",\"confidence\":80,\"source_ids\":[\"source_ch74_wangfuren_qingwen\",\"source_ch36_wangfuren_xiren\",\"source_ch30_jinchuan\"]},{\"id\":\"viewpoint_qingwen_power_politics\",\"title\":\"权力政治：逐晴雯是袭人派的胜利\",\"summary\":\"怡红院内部存在袭人派与晴雯派的隐性竞争，王善保家的告状只是压垮晴雯的最后一根稻草。\",\"argument_body\":\"晴雯与袭人的对立不仅是性格对立，更是路线对立：袭人走「宝钗路线」（劝宝玉读书、与王夫人结盟），晴雯走「黛玉路线」（纵容宝玉的天性、拒绝规训）。王夫人逐晴雯，客观上完成了袭人派对怡红院的清洗——芳官、四儿等与晴雯交好的丫鬟同批被逐，唯独袭人、麝月、秋纹留下。宝玉在晴雯死后质问「怎么人人的不是太太都知道，单不挑出你和麝月秋纹来」，已明确指向袭人告密的嫌疑。即便袭人没有主动告密，她的生存策略与王夫人的清洗行动在结构上完全同构。\",\"stance_type\":\"pro_politics\",\"fact_type\":\"text_inference\",\"confidence\":65,\"source_ids\":[\"source_ch77_baoyu_question\",\"source_ch34_xiren_wangfuren\"]},{\"id\":\"viewpoint_qingwen_daiyu_shadow\",\"title\":\"杀鸡儆猴：晴雯是黛玉的替身\",\"summary\":\"王夫人逐晴雯的真正目标是警告黛玉——因为晴雯是黛玉的「影子」。\",\"argument_body\":\"王夫人明确说过晴雯「眉眼又有些像你林妹妹」。第七十四回她问凤姐「有一个水蛇腰、削肩膀、眉眼又有些像你林妹妹的，正在那里骂小丫头」——这一句细节将晴雯与黛玉直接挂钩。脂批指出晴雯是「黛影」，袭人是「钗副」——十二钗的丫鬟体系是主子命运的镜像。王夫人不能直接打击黛玉（贾母之宠、体面所在），但打击「黛影」晴雯毫无顾忌。逐晴雯的实质是王夫人对「木石前盟」的间接否定——她清理的不是一个丫鬟，而是宝玉身边的一切「黛玉化」元素。\",\"stance_type\":\"pro_symbolism\",\"fact_type\":\"scholarly_viewpoint\",\"confidence\":70,\"source_ids\":[\"source_ch74_wangfuren_qingwen\",\"source_zhipi_qingwen_daiying\"]}]},{\"id\":\"question_qingwen_daiyu_shadow\",\"title\":\"晴雯是不是黛玉的「影子」？\",\"heat_weight\":78,\"viewpoints\":[{\"id\":\"viewpoint_qingwen_is_shadow\",\"title\":\"镜像论：晴雯是黛玉的丫鬟版\",\"summary\":\"曹雪芹以「主奴镜像」手法，让晴雯提前演出黛玉的命运——晴雯之死是黛玉之死的预演。\",\"argument_body\":\"对应关系是全方位的：容貌（王夫人亲证「眉眼又有些像你林妹妹」）、性格（孤标傲世、不媚俗）、疾病（晴雯病补雀金裘累垮身体，黛玉肺病缠身）、罪名（「狐狸精」之罪与黛玉的「自恃貌才」之罪同构）、结局（晴雯被逐而死→黛玉被弃而死）。《芙蓉女儿诔》表面诔晴雯，脂批直指「实诔黛玉」。晴雯死在第77-78回，黛玉死在第97-98回——中间二十回就是宝黛爱情的「缓刑期」。这种结构安排意味着：曹雪芹用晴雯的速死来预告黛玉的慢死，用丫鬟的悲剧来映射小姐的悲剧，形成「小悲剧预演大悲剧」的嵌套结构。\",\"stance_type\":\"pro_mirror\",\"fact_type\":\"scholarly_viewpoint\",\"confidence\":85,\"source_ids\":[\"source_zhipi_qingwen_daiying\",\"source_ch78_furong_lei\",\"source_ch74_wangfuren_qingwen\"]},{\"id\":\"viewpoint_qingwen_not_shadow\",\"title\":\"独立论：晴雯是独立人格，不是影子\",\"summary\":\"把晴雯简化为黛玉的「影子」会遮蔽她独特的性格价值——晴雯的烈与黛玉的怨本质不同。\",\"argument_body\":\"晴雯的核心性格是「烈」：撕扇子（第31回）是快意，病补雀金裘（第52回）是痴勇，临终赠甲（第77回）是决绝。她从不哭泣自怜，而是正面迎击——骂小红、顶撞王善保家的、临终前说「我今儿既担了虚名，早知如此，我当日也另有个道理」。这与黛玉的「敏感-试探-自伤」模式完全不同。黛玉是诗人，晴雯是战士。红学中的「影子论」源于脂批的修辞策略（用丫鬟体系简化十二钗结构），但若将人物还原为符号，就失去了曹雪芹「千红一哭」中对每一个个体的尊重——晴雯值得作为晴雯被理解，而非作为黛玉的预告片。\",\"stance_type\":\"contra_mirror\",\"fact_type\":\"scholarly_viewpoint\",\"confidence\":65,\"source_ids\":[\"source_ch31_si_shanzi\",\"source_ch52_bubeng_jingqiu\",\"source_ch77_qingwen_linzong\"]},{\"id\":\"viewpoint_qingwen_system_parallel\",\"title\":\"体系论：钗黛体系中的结构性对位\",\"summary\":\"晴雯与袭人的对立复制了黛玉与宝钗的对立——这是「钗黛合一」叙事策略在丫鬟层的展开。\",\"argument_body\":\"曹雪芹在怡红院复制了一个微型的「钗黛对峙」：晴雯（黛系：不劝宝玉、纵容天性、以「情」为核心）对袭人（钗系：劝宝玉、规训行为、以「礼」为核心）。两个体系的丫鬟命运与主子命运同构：晴雯之死预演黛玉之死，袭人改嫁蒋玉菡暗示宝钗终成弃妇（「堪羡优伶有福，谁知公子无缘」）。这套结构说明曹雪芹是在自觉地经营「体系性对位」——每个人物都不是孤立的，而是整个命运网络中的一个节点。晴雯既是黛玉的影子，也是黛玉的「先行者」，同时还是「晴雯自己」——三层身份并存不悖，这才是「影子论」的正确打开方式。\",\"stance_type\":\"neutral_analysis\",\"fact_type\":\"scholarly_viewpoint\",\"confidence\":72,\"source_ids\":[\"source_ch05_qingwen_judgment\",\"source_ch05_xiren_judgment\"]}]},{\"id\":\"question_baochai_urge_baoyu\",\"title\":\"宝钗为什么总劝宝玉读仕途经济之书？\",\"heat_weight\":76,\"viewpoints\":[{\"id\":\"viewpoint_baochai_value_system\",\"title\":\"价值观论：读书是宝钗的世界观\",\"summary\":\"宝钗劝学不是「劝」而是「信」——她的价值观中，男性的价值就在于科举功名、修身齐家。\",\"argument_body\":\"宝钗的家世决定了她的价值坐标：薛家是「珍珠如土金如铁」的皇商家庭，兄长薛蟠无能败家，家族延续的希望全寄托在「读书明理」上。宝钗自幼读书，「杂学旁收」无所不晓，但她对书的定位极其明确——第四十二回她对黛玉说「男人们读书明理，辅国治民，这便好了。只是如今并不听见有这样的人」——注意：她批评的不是读书本身，而是「读了书不能明理」。在她的体系中，劝宝玉读书=希望他成为「读书明理辅国治民」的理想男性。这与黛玉「从不劝他」形成对照——不是黛玉不关心，而是二人的「理想男性」定义不同：宝钗要宝玉成为制度内的好人，黛玉要宝玉保持天性本真。\",\"stance_type\":\"pro_value\",\"fact_type\":\"text_inference\",\"confidence\":78,\"source_ids\":[\"source_ch42_lanyan\",\"source_ch32_heartfelt\"]},{\"id\":\"viewpoint_baochai_investment\",\"title\":\"投资论：劝学是对「金玉良缘」的未来经营\",\"summary\":\"宝钗的劝学背后有婚姻策略的考量——她早已把自己视为宝玉的未来伴侣，读书是婚后生活的保障。\",\"argument_body\":\"宝钗的劝学频率与「金玉良缘」舆论的演进同步。第二十八回元春赐礼后（婚配暗示最明显的一次），她「总远着宝玉」；但此后的劝学行为不减反增。一个细节：第三十六回她坐在宝玉床边绣鸳鸯肚兜——这是全书最明确的「准新娘」姿态（袭人刚与王夫人达成协议，鸳鸯肚兜正是「通房丫鬟」的活计）。在这个场景中，她听到宝玉梦中喊骂「和尚道士的话如何信得？什么金玉姻缘，我偏说是木石姻缘」——这一梦中宣言直接击中宝钗。如果她只是「表姐的关心」，此刻应该愤怒或尴尬；但她的反应是「怔了」——说明她真的将「金玉姻缘」当作了自己的人生规划，而宝玉的梦中拒绝动摇了这个规划。劝学是这个规划的一部分：她要的不是宝玉的人，而是一个「配得上金玉良缘」的宝玉。\",\"stance_type\":\"pro_strategy\",\"fact_type\":\"text_inference\",\"confidence\":62,\"source_ids\":[\"source_ch36_xiu_yuanyang\",\"source_ch36_meng_zhong\"]},{\"id\":\"viewpoint_baochai_reality\",\"title\":\"现实论：劝学是她对家族危机的清醒应对\",\"summary\":\"宝钗是全书最早看清贾府经济危机的人之一。劝宝玉读书不是迂腐，而是绝望的现实主义。\",\"argument_body\":\"宝钗是「热毒」被冷香丸压制的人——她的理性不是天生的，而是被家族危机逼出来的。薛家已经败落：父亲早逝、兄长荒唐、家业渐空。她在第四十七回对母亲说「哥哥只怕更不成器了」、第五十七回说「妈和我哥哥商量……也只好长线放远鹞」——她对「不读书不挣功名的男人」的下场有切肤之痛（薛蟠就是活例）。在她的认知框架中，贾府的衰败已是必然，唯一能延缓衰败的路径就是宝玉读书中举、重振家声——这是封建家庭女性唯一能想象的「自救方案」。她的劝学本质是「风险管理」：如果连宝玉都放弃功名，贾薛两家将无任何依靠。这个视角下，宝钗不是卫道士，而是家族悲剧的清醒见证者。\",\"stance_type\":\"neutral_analysis\",\"fact_type\":\"scholarly_viewpoint\",\"confidence\":70,\"source_ids\":[\"source_ch47_baochai_xuepan\",\"source_ch05_baochai_judgment\"]}]},{\"id\":\"question_xiren_qingwen_comparison\",\"title\":\"袭人与晴雯为什么经常被放在一起比较？\",\"heat_weight\":74,\"viewpoints\":[{\"id\":\"viewpoint_xiren_qingwen_mirror\",\"title\":\"镜像论：她们是钗黛之争的丫鬟层投影\",\"summary\":\"脂批「晴有林风，袭乃钗副」揭示：曹雪芹在怡红院复制了钗黛对峙——袭人劝宝玉读书（宝钗路线），晴雯从不劝（黛玉路线）。\",\"argument_body\":\"对应关系是全方位的：价值观上，袭人劝宝玉「读书上进、和光同尘」（第19回「情切切良宵花解语」的规劝三部曲），晴雯则说「二爷要学习，也不用我劝」（纵容天性）；行为上，袭人以「贤」立身（第36回被王夫人内定为「准姨娘」），晴雯以「勇」立身（第52回病补雀金裘）；命运上，袭人的结局是「堪羡优伶有福，谁知公子无缘」——她最终嫁给了蒋玉菡（一个戏子），晴雯的结局是「寿夭多因毁谤生」——她至死保持着处女之身却背着「狐狸精」的污名。最深的对应是：宝钗与袭人都是「体制内的成功者」（一度接近婚姻/姨娘的既定目标），黛玉与晴雯都是「体制外的牺牲者」（死于体制的挤压）——而曹雪芹对她们的最终评价在判词中清晰可辨：对晴雯的「抱屈」与对袭人的「谁知」都带着深刻的同情与反讽。\",\"stance_type\":\"pro_mirror\",\"fact_type\":\"scholarly_viewpoint\",\"confidence\":78,\"source_ids\":[\"source_ch05_xiren_judgment\",\"source_ch05_qingwen_judgment\",\"source_zhipi_xiren_qingwen\"]},{\"id\":\"viewpoint_xiren_qingwen_moral\",\"title\":\"道德辩论论：她们的分野是「对宝玉好」的两种定义\",\"summary\":\"袭人与晴雯的冲突本质是对「什么是对宝玉好」的两种回答：改造他（袭人）还是成全他（晴雯）——这场辩论至今无解。\",\"argument_body\":\"袭人的立场：宝玉的出路在体制内（读书中举、成家立业），所以她要「改造」宝玉——劝读书、劝应酬、劝他改掉「爱吃胭脂」的毛病。她的逻辑是现实主义：以宝玉的天性，不改则灭。晴雯的立场：宝玉的价值恰恰在他的天性（对女儿的尊重、对美的痴迷、对功名的蔑视），所以她要「成全」宝玉——撕扇子（第31回）是成全他的「千金难买一笑」，病补雀金裘（第52回）是成全他的「体面」，至死不劝是成全他的「本真」。两种立场的结局：袭人的改造被证明无效（宝玉最终出家，她的「姨娘梦」破灭）；晴雯的成全被证明危险（她的「纵容」被王夫人视为「勾引」）。曹雪芹的立场在《芙蓉女儿诔》中表露无疑——他把最深情的文字给了晴雯，而袭人只得到一句「谁知公子无缘」的叹息。\",\"stance_type\":\"pro_moral\",\"fact_type\":\"text_inference\",\"confidence\":74,\"source_ids\":[\"source_ch19_xiren_persuade\",\"source_ch31_si_shanzi\",\"source_ch78_furong_lei\"]},{\"id\":\"viewpoint_xiren_qingwen_readers\",\"title\":\"读者论：二百年来的「袭晴之争」是《红楼梦》接受史的核心战场\",\"summary\":\"读者对袭人与晴雯的评价分歧，本质上是对「世俗成功学」与「浪漫本真论」两种价值观的站队。\",\"argument_body\":\"袭晴之争的历史：清代评点家（王希廉等）多褒袭贬晴——袭人「贤德」，晴雯「轻浮」；五四以后（俞平伯、鲁迅时代）风向逆转——晴雯的「不屈服」被塑造为反封建象征，袭人则被斥为「告密者」；当代阅读更趋多元：袭人的「难处」（既要保护宝玉又要自保）与晴雯的「盲区」（不懂权力游戏）都被重新审视。这个争论的持久性说明：二人已经不是人物，而是「命题」——袭人代表「顺应体制能否保全自己」（答案：不能，她终究「公子无缘」）；晴雯代表「对抗体制能否保全自己」（答案：也不能，她「寿夭多因毁谤生」）。两种策略都失败了——这才是曹雪芹最深的悲观：在封建制度下，顺从与反抗殊途同归，唯有「情」本身（宝玉的悼念）在废墟上幸存。\",\"stance_type\":\"neutral_analysis\",\"fact_type\":\"scholarly_viewpoint\",\"confidence\":70,\"source_ids\":[\"source_ch05_xiren_judgment\",\"source_ch05_qingwen_judgment\"]}]},{\"id\":\"question_wangfuren_trusts_xiren\",\"title\":\"王夫人为什么更信任袭人而不是晴雯？\",\"heat_weight\":68,\"viewpoints\":[{\"id\":\"viewpoint_xiren_trust_values\",\"title\":\"价值观论：王夫人信任的是「与自己同构的人」\",\"summary\":\"袭人向王夫人进言「男女之防」正中其核心焦虑——二人共享同一套礼教价值观，信任因此建立。\",\"argument_body\":\"第三十四回是转折点：宝玉挨打后，王夫人找袭人问话，袭人主动进言「怎么变个法儿，以后竟还教二爷搬出园外来住就好了」——她担心的是「园内人多口杂，日后倘或有些别的事，或者有那等不知廉耻的，做出什么不才之事来，反连累着二爷的名声」。这段话的杀伤力在于它精确复述了王夫人最大的恐惧（宝玉名声受损），并提供了解决方案（搬出园子）。王夫人的反应是「如雷轰电掣的一般」——她当场感慨「我的儿，你竟有这个心胸，想的这样周全！……难为你成全我娘儿两个声名体面」。第三十六回她便提升袭人月钱至二两银子一吊钱（姨娘的待遇），并说「把他交给你，好歹留心，保全了他，就是保全了我」。信任的本质在此显形：王夫人信任的不是袭人这个人，而是袭人对「礼教秩序」的忠诚——这种忠诚与她自己管理贾府的方式完全同构。\",\"stance_type\":\"pro_values\",\"fact_type\":\"text_inference\",\"confidence\":78,\"source_ids\":[\"source_ch34_xiren_jinyan\",\"source_ch36_xiren_promote\"]},{\"id\":\"viewpoint_qingwen_threat\",\"title\":\"威胁论：晴雯的「美而自由」是王夫人最深的威胁\",\"summary\":\"晴雯的每一个特质（美貌、口才、独立性、像黛玉）都触发了王夫人对「狐狸精」的原型恐惧。\",\"argument_body\":\"王夫人驱逐晴雯时的核心指控是「我看不上这浪样儿！谁许你这样花红柳绿的妆扮！」——注意：晴雯的「罪状」不是事实（她与宝玉毫无私情），而是「样子」：她长得像黛玉（美）、不打扮就「水蛇腰削肩膀」（天然的风流体态）、说话爽利（不像袭人那样「沉重」）。在王夫人的认知体系中，「美」+「不驯服」=「勾引」——这个等式不需要证据，只需要直觉。更深一层：晴雯是贾母的人（贾母说「我的意思这些丫头的模样爽利言谈针线多不及他，将来只他还可以给宝玉使唤得」）——驱逐晴雯也是王夫人与贾母之间「宝玉身边人事权」的较量。王夫人选袭人弃晴雯，既是价值观选择，也是权力宣告：宝玉的未来由她（而非贾母）定义。\",\"stance_type\":\"pro_threat\",\"fact_type\":\"scholarly_viewpoint\",\"confidence\":74,\"source_ids\":[\"source_ch74_wangfuren_qingwen\",\"source_ch78_jiamu_qingwen\",\"source_ch77_qingwen_expelled\"]},{\"id\":\"viewpoint_xiren_trust_utilitarian\",\"title\":\"实用论：王夫人需要的是「管理者」而非「美人」\",\"summary\":\"王夫人的选择本质是管理逻辑：袭人是「能用的人」（能管束、能通风报信、能维持秩序），晴雯是「失控的人」。\",\"argument_body\":\"王夫人的用人标准在全书极为一致：她需要的是「能把宝玉管住的人」。金钏因一句轻浮话被逐（说明她不能容忍「轻浮型」），袭人因一次进言被提拔（说明她奖赏「规劝型」）。从管理角度看：袭人提供的是「控制功能」——她劝宝玉、盯下人、向王夫人汇报动态（无论是否「告密」，客观上她是王夫人在怡红院的信息节点）；晴雯提供的是「不稳定因素」——她挑动是非（骂小红、顶撞王善保家的）、纵容宝玉、且不受任何人的管束。一个要「保全儿子声名」的母亲，在「控制型丫鬟」与「自由型丫鬟」之间选择前者，是必然的。王夫人的悲剧在于：她需要的「管理者」最终也没能管住宝玉（宝玉出家），而那个「失控者」反而让宝玉最接近「人性」——她的管理逻辑与宝玉的人性逻辑，从第三十六回（信任袭人）到第七十七回（驱逐晴雯），始终在互相摧毁。\",\"stance_type\":\"neutral_analysis\",\"fact_type\":\"text_inference\",\"confidence\":72,\"source_ids\":[\"source_ch36_xiren_promote\",\"source_ch74_wangfuren_qingwen\"]}]}]}]}]\nb:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n10:I[27201,[\"/_next/static/chunks/3hkbun0grg2v7.js\",\"/_next/static/chunks/19dj7h0a4hfs2.js\"],\"IconMark\"]\n8:null\nd:[[\"$\",\"title\",\"0\",{\"children\":\"袭人 · 红楼宇宙\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"宝玉身边最体贴的大丫鬟，以「贤袭人」著称。\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L10\",\"3\",{}]]\n"])</script></body></html>
