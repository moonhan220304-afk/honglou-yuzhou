深的恐惧——一个像黛玉的、美丽的、不受控制的丫鬟，会毁掉宝玉。\",\"stance_type\":\"pro_ritual_defense\",\"fact_type\":\"text_inference\",\"confidence\":80,\"source_ids\":[\"source_ch74_wangfuren_qingwen\",\"source_ch36_wangfuren_xiren\",\"source_ch30_jinchuan\"]},{\"id\":\"viewpoint_qingwen_power_politics\",\"title\":\"权力政治：逐晴雯是袭人派的胜利\",\"summary\":\"怡红院内部存在袭人派与晴雯派的隐性竞争，王善保家的告状只是压垮晴雯的最后一根稻草。\",\"argument_body\":\"晴雯与袭人的对立不仅是性格对立，更是路线对立：袭人走「宝钗路线」（劝宝玉读书、与王夫人结盟），晴雯走「黛玉路线」（纵容宝玉的天性、拒绝规训）。王夫人逐晴雯，客观上完成了袭人派对怡红院的清洗——芳官、四儿等与晴雯交好的丫鬟同批被逐，唯独袭人、麝月、秋纹留下。宝玉在晴雯死后质问「怎么人人的不是太太都知道，单不挑出你和麝月秋纹来」，已明确指向袭人告密的嫌疑。即便袭人没有主动告密，她的生存策略与王夫人的清洗行动在结构上完全同构。\",\"stance_type\":\"pro_politics\",\"fact_type\":\"text_inference\",\"confidence\":65,\"source_ids\":[\"source_ch77_baoyu_question\",\"source_ch34_xiren_wangfuren\"]},{\"id\":\"viewpoint_qingwen_daiyu_shadow\",\"title\":\"杀鸡儆猴：晴雯是黛玉的替身\",\"summary\":\"王夫人逐晴雯的真正目标是警告黛玉——因为晴雯是黛玉的「影子」。\",\"argument_body\":\"王夫人明确说过晴雯「眉眼又有些像你林妹妹」。第七十四回她问凤姐「有一个水蛇腰、削肩膀、眉眼又有些像你林妹妹的，正在那里骂小丫头」——这一句细节将晴雯与黛玉直接挂钩。脂批指出晴雯是「黛影」，袭人是「钗副」——十二钗的丫鬟体系是主子命运的镜像。王夫人不能直接打击黛玉（贾母之宠、体面所在），但打击「黛影」晴雯毫无顾忌。逐晴雯的实质是王夫人对「木石前盟」的间接否定——她清理的不是一个丫鬟，而是宝玉身边的一切「黛玉化」元素。\",\"stance_type\":\"pro_symbolism\",\"fact_type\":\"scholarly_viewpoint\",\"confidence\":70,\"source_ids\":[\"source_ch74_wangfuren_qingwen\",\"source_zhipi_qingwen_daiying\"]}]},{\"id\":\"question_fate_system_or_character\",\"title\":\"红楼人物的「命运」到底是制度造成的，还是性格造成的？\",\"heat_weight\":80,\"viewpoints\":[{\"id\":\"viewpoint_fate_system\",\"title\":\"制度论：千红一哭的根源是「吃人的制度」\",\"summary\":\"马克思主义红学的主流解读：大观园的女性悲剧是封建制度的系统性犯罪——个体性格只是制度施暴的借口。\",\"argument_body\":\"制度的「吃人」清单：黛玉死于婚姻制度（父母之命剥夺了她的爱情选择权）；晴雯死于奴婢制度（主子对「下贱人」的生杀予夺）；迎春死于父权制度（父亲有权卖女）；金钏死于礼教制度（一句玩笑被定性为「勾引」）；司棋死于贞洁制度（自由恋爱等于失节）；鸳鸯死于妾侍制度（她唯一的反抗是死亡）；香菱死于恶奴制度（买来的妾可以被随意折磨）；尤三姐死于贞操审判（「改过」不被允许）。这些案例的共同点：悲剧的「直接凶手」（王夫人、贾赦、孙绍祖）都是制度授权的执行者——换一个执行者，悲剧照常发生。制度的可怕之处不在于「坏人的坏」，而在于「好人的平庸之恶」：贾母的无奈、王夫人的恐惧、贾政的迂腐——他们都不是恶人，但都在执行制度的杀人命令。「千红一哭，万艳同悲」因此不是十二个人的悲剧，而是整个制度下的女性群像的悲剧。\",\"stance_type\":\"pro_system\",\"fact_type\":\"scholarly_viewpoint\",\"confidence\":76,\"source_ids\":[\"source_ch05_feiniao\",\"source_ch46_yuanyang\",\"source_ch66_you_sanjie\"]},{\"id\":\"viewpoint_fate_character\",\"title\":\"性格论：同样的制度下，有人活出了不同的命运\",\"summary\":\"制度决定「压力」，性格决定「应对」——探春的争、宝钗的忍、黛玉的敏、迎春的懦，在同一制度下导向不同结局。\",\"argument_body\":\"控制变量的比较是性格论的最强论据：同为庶出小姐——探春以「争」立身（理家、远嫁后仍有尊严），迎春以「让」丧命（被卖被打被弃）；同为寄居孤女——黛玉以「敏」伤人伤己（焚稿断情），湘云以「豪」渡劫（「幸生来英豪阔大宽宏量」）；同为丫鬟——袭人以「顺」自保（一度接近姨娘），晴雯以「烈」速死（被逐而亡）；同为管家——凤姐以「贪」覆灭（机关算尽），探春以「清」全身而退（远嫁藩王）。这些对照说明：曹雪芹不是单因论者——他同时展示「制度的压力」与「性格的变量」。「性格悲剧」论提醒我们不要忽视文本的丰富性：如果一切归于制度，《红楼梦》就只是社会报告；正因为黛玉的「多心」加速了她的死亡、凤姐的「聪明」反算了性命，人物才具有了悲剧的「能动性」——她们参与了自身的毁灭，这正是希腊悲剧式的深刻。\",\"stance_type\":\"pro_character\",\"fact_type\":\"scholarly_viewpoint\",\"confidence\":70,\"source_ids\":[\"source_ch05_tanchun_judgment\",\"source_ch05_xifeng_judgment\",\"source_ch22_baoyu_wuchanji\"]},{\"id\":\"viewpoint_fate_destiny\",\"title\":\"宿命论：真正的决定者既非制度也非性格，而是「命」\",\"summary\":\"《红楼梦》的终极悲剧观是宿命论的——第五回的判词、第一回的神话、反复出现的谶语，共同宣告：一切早已写定。\",\"argument_body\":\"文本的宿命装置无处不在：判词（第5回）、曲文、灯谜（第22回全部谜底都是凶谶）、诗句（第63回花签）、梦境（第5回、第116回）、神话（还泪之约）。这些装置的功能不是「解释」而是「取消解释」：如果命运在神话中已定（绛珠还泪），那么黛玉之死既不需要制度的「原因」也不需要性格的「原因」——她「必须」泪尽而死，这是神话逻辑的完成。曹雪芹的深刻之处在于他不选边：制度与性格都是「命」的执行工具——制度提供了「死法」（婚姻压迫），性格提供了「死因」（多愁善感），而「命」提供了「死的必然性」（判词）。三者缺一不可，但「命」是终极变量。这种三层悲剧结构（宿命-制度-性格）使《红楼梦》超越了单一的社会批判或性格研究——它是「完整的悲剧」：既有希腊式的命运感，又有现实主义的社会纵深，还有心理小说的人物深度。\",\"stance_type\":\"pro_destiny\",\"fact_type\":\"scholarly_viewpoint\",\"confidence\":78,\"source_ids\":[\"source_ch01_jiangzhu\",\"source_ch05_panjic\",\"source_ch22_riddles\"]}]},{\"id\":\"question_qingwen_daiyu_shadow\",\"title\":\"晴雯是不是黛玉的「影子」？\",\"heat_weight\":78,\"viewpoints\":[{\"id\":\"viewpoint_qingwen_is_shadow\",\"title\":\"镜像论：晴雯是黛玉的丫鬟版\",\"summary\":\"曹雪芹以「主奴镜像」手法，让晴雯提前演出黛玉的命运——晴雯之死是黛玉之死的预演。\",\"argument_body\":\"对应关系是全方位的：容貌（王夫人亲证「眉眼又有些像你林妹妹」）、性格（孤标傲世、不媚俗）、疾病（晴雯病补雀金裘累垮身体，黛玉肺病缠身）、罪名（「狐狸精」之罪与黛玉的「自恃貌才」之罪同构）、结局（晴雯被逐而死→黛玉被弃而死）。《芙蓉女儿诔》表面诔晴雯，脂批直指「实诔黛玉」。晴雯死在第77-78回，黛玉死在第97-98回——中间二十回就是宝黛爱情的「缓刑期」。这种结构安排意味着：曹雪芹用晴雯的速死来预告黛玉的慢死，用丫鬟的悲剧来映射小姐的悲剧，形成「小悲剧预演大悲剧」的嵌套结构。\",\"stance_type\":\"pro_mirror\",\"fact_type\":\"scholarly_viewpoint\",\"confidence\":85,\"source_ids\":[\"source_zhipi_qingwen_daiying\",\"source_ch78_furong_lei\",\"source_ch74_wangfuren_qingwen\"]},{\"id\":\"viewpoint_qingwen_not_shadow\",\"title\":\"独立论：晴雯是独立人格，不是影子\",\"summary\":\"把晴雯简化为黛玉的「影子」会遮蔽她独特的性格价值——晴雯的烈与黛玉的怨本质不同。\",\"argument_body\":\"晴雯的核心性格是「烈」：撕扇子（第31回）是快意，病补雀金裘（第52回）是痴勇，临终赠甲（第77回）是决绝。她从不哭泣自怜，而是正面迎击——骂小红、顶撞王善保家的、临终前说「我今儿既担了虚名，早知如此，我当日也另有个道理」。这与黛玉的「敏感-试探-自伤」模式完全不同。黛玉是诗人，晴雯是战士。红学中的「影子论」源于脂批的修辞策略（用丫鬟体系简化十二钗结构），但若将人物还原为符号，就失去了曹雪芹「千红一哭」中对每一个个体的尊重——晴雯值得作为晴雯被理解，而非作为黛玉的预告片。\",\"stance_type\":\"contra_mirror\",\"fact_type\":\"scholarly_viewpoint\",\"confidence\":65,\"source_ids\":[\"source_ch31_si_shanzi\",\"source_ch52_bubeng_jingqiu\",\"source_ch77_qingwen_linzong\"]},{\"id\":\"viewpoint_qingwen_system_parallel\",\"title\":\"体系论：钗黛体系中的结构性对位\",\"summary\":\"晴雯与袭人的对立复制了黛玉与宝钗的对立——这是「钗黛合一」叙事策略在丫鬟层的展开。\",\"argument_body\":\"曹雪芹在怡红院复制了一个微型的「钗黛对峙」：晴雯（黛系：不劝宝玉、纵容天性、以「情」为核心）对袭人（钗系：劝宝玉、规训行为、以「礼」为核心）。两个体系的丫鬟命运与主子命运同构：晴雯之死预演黛玉之死，袭人改嫁蒋玉菡暗示宝钗终成弃妇（「堪羡优伶有福，谁知公子无缘」）。这套结构说明曹雪芹是在自觉地经营「体系性对位」——每个人物都不是孤立的，而是整个命运网络中的一个节点。晴雯既是黛玉的影子，也是黛玉的「先行者」，同时还是「晴雯自己」——三层身份并存不悖，这才是「影子论」的正确打开方式。\",\"stance_type\":\"neutral_analysis\",\"fact_type\":\"scholarly_viewpoint\",\"confidence\":72,\"source_ids\":[\"source_ch05_qingwen_judgment\",\"source_ch05_xiren_judgment\"]}]},{\"id\":\"question_search_garden_reveals\",\"title\":\"抄检大观园真正暴露了贾府什么问题？\",\"heat_weight\":76,\"viewpoints\":[{\"id\":\"viewpoint_search_internal\",\"title\":\"内部崩溃论：抄检是大族「自杀自灭」的启动键\",\"summary\":\"探春的预言在此回被精确兑现：从外头杀来一时杀不死，从家里自杀自灭才能一败涂地——抄检就是「自杀自灭」的正式开始。\",\"argument_body\":\"第七十四回的抄检本质是贾府第一次「以内部斗争逻辑」处理问题：王善保家的（邢夫人势力）与王夫人（二房势力）的暗斗、王熙凤的敷衍执行、各房丫鬟的互相攀咬——一次「整顿风化」的行动变成了权力清算。探春在被搜时说「你们别忙，自然连你们抄的日子有呢」「可知这样大族人家……必须先从家里自杀自灭起来，才能一败涂地」——这预言在第105回被兑现（锦衣军查抄）。抄检的深层暴露：贾府已经失去了「内部消化矛盾」的能力——原本该用管理手段解决的问题（下人纪律），只能用暴力手段（搜查）解决；而暴力手段又制造了新的矛盾（晴雯之死、司棋之死、芳官出家）。从抄检到查抄，中间只有三十回——内部的暴力一旦启动，外部的暴力就接踵而至。\",\"stance_type\":\"pro_internal\",\"fact_type\":\"text_inference\",\"confidence\":80,\"source_ids\":[\"source_ch74_tanchun_predict\",\"source_ch74_search_garden\",\"source_ch105_cha_chao\"]},{\"id\":\"viewpoint_search_utopia_end\",\"title\":\"乌托邦终结论：抄检是对「青春王国」的暴力突袭\",\"summary\":\"大观园此前的功能是庇护青春（诗社、恋爱、自由），抄检是成人世界对这个庇护所的总攻——晴雯之死就是乌托邦之死。\",\"argument_body\":\"抄检的每个细节都充满「入侵」的意象：深夜、灯笼、翻箱倒柜、搜身——成人世界的暴力工具（王善保家的「举起手来摸了晴雯的身上」）直接践踏了少女们的身体与尊严。被抄的各房反应构成一部「青春档案」：怡红院——晴雯「豁一声将箱子掀开」以死抗争；潇湘馆——黛玉冷眼旁观（她被搜出的「宝玉旧物」反而成了爱情的证据）；秋爽斋——探春拒搜并以「先来搜我的箱柜」的胆气护住丫鬟；暖香坞——惜春借机赶走入画；蓼风轩——司棋与潘又安的私情暴露（唯一的「真赃」）。抄检的结果：晴雯死、司棋死、芳官等出家、宝钗避嫌搬出——大观园的诗社、夜宴、联句时代就此终结。第76回的中秋夜「品笛感凄清」就是乌托邦的葬礼。\",\"stance_type\":\"pro_utopia\",\"fact_type\":\"scholarly_viewpoint\",\"confidence\":76,\"source_ids\":[\"source_ch74_search_garden\",\"source_ch77_fangguan\",\"source_ch76_midautumn\"]},{\"id\":\"viewpoint_search_hypocrisy\",\"title\":\"虚伪揭露论：抄检撕破了「诗书簪缨」的面具\",\"summary\":\"抄检的最大讽刺在于「查淫者最淫」：下令查抄的王夫人自己的丈夫（贾赦）与儿子（宝玉）的「淫」从未被查——礼教的矛头永远指向最弱者。\",\"argument_body\":\"绣春囊的真正主人是谁，全书未明说，但贾赦（连丫鬟、纳鸳鸯不成又买嫣红）、贾琏（鲍二家的、尤二姐、多姑娘）、贾珍（爬灰）——成年男性的荒淫是公开的秘密，从未被追究。而一个绣春囊引发的抄检，最后惩罚的是：晴雯（无辜，仅因「轻狂」）、司棋（自由恋爱）、芳官（戏子身份）、四儿（「同日生日就是夫妻」的玩笑）——全部是下层女性。探春的质问一针见血：「你们别忙，自然连你们抄的日子有呢」；晴雯的临终遗言「我死也不甘心的：我虽生的比别人略好些，并没有私情密意勾引你怎样」——她至死不明白自己为何而死。抄检暴露的终极问题是：这个以「诗书」立家的贵族，其「礼教」从来只是管理下层女性的工具，而「诗书簪缨」只是写在门面上的字。\",\"stance_type\":\"pro_hypocrisy\",\"fact_type\":\"text_inference\",\"confidence\":78,\"source_ids\":[\"source_ch73_xiuchunnang\",\"source_ch77_qingwen_linzong\",\"source_ch74_search_garden\"]}]},{\"id\":\"question_xiren_qingwen_comparison\",\"title\":\"袭人与晴雯为什么经常被放在一起比较？\",\"heat_weight\":74,\"viewpoints\":[{\"id\":\"viewpoint_xiren_qingwen_mirror\",\"title\":\"镜像论：她们是钗黛之争的丫鬟层投影\",\"summary\":\"脂批「晴有林风，袭乃钗副」揭示：曹雪芹在怡红院复制了钗黛对峙——袭人劝宝玉读书（宝钗路线），晴雯从不劝（黛玉路线）。\",\"argument_body\":\"对应关系是全方位的：价值观上，袭人劝宝玉「读书上进、和光同尘」（第19回「情切切良宵花解语」的规劝三部曲），晴雯则说「二爷要学习，也不用我劝」（纵容天性）；行为上，袭人以「贤」立身（第36回被王夫人内定为「准姨娘」），晴雯以「勇」立身（第52回病补雀金裘）；命运上，袭人的结局是「堪羡优伶有福，谁知公子无缘」——她最终嫁给了蒋玉菡（一个戏子），晴雯的结局是「寿夭多因毁谤生」——她至死保持着处女之身却背着「狐狸精」的污名。最深的对应是：宝钗与袭人都是「体制内的成功者」（一度接近婚姻/姨娘的既定目标），黛玉与晴雯都是「体制外的牺牲者」（死于体制的挤压）——而曹雪芹对她们的最终评价在判词中清晰可辨：对晴雯的「抱屈」与对袭人的「谁知」都带着深刻的同情与反讽。\",\"stance_type\":\"pro_mirror\",\"fact_type\":\"scholarly_viewpoint\",\"confidence\":78,\"source_ids\":[\"source_ch05_xiren_judgment\",\"source_ch05_qingwen_judgment\",\"source_zhipi_xiren_qingwen\"]},{\"id\":\"viewpoint_xiren_qingwen_moral\",\"title\":\"道德辩论论：她们的分野是「对宝玉好」的两种定义\",\"summary\":\"袭人与晴雯的冲突本质是对「什么是对宝玉好」的两种回答：改造他（袭人）还是成全他（晴雯）——这场辩论至今无解。\",\"argument_body\":\"袭人的立场：宝玉的出路在体制内（读书中举、成家立业），所以她要「改造」宝玉——劝读书、劝应酬、劝他改掉「爱吃胭脂」的毛病。她的逻辑是现实主义：以宝玉的天性，不改则灭。晴雯的立场：宝玉的价值恰恰在他的天性（对女儿的尊重、对美的痴迷、对功名的蔑视），所以她要「成全」宝玉——撕扇子（第31回）是成全他的「千金难买一笑」，病补雀金裘（第52回）是成全他的「体面」，至死不劝是成全他的「本真」。两种立场的结局：袭人的改造被证明无效（宝玉最终出家，她的「姨娘梦」破灭）；晴雯的成全被证明危险（她的「纵容」被王夫人视为「勾引」）。曹雪芹的立场在《芙蓉女儿诔》中表露无疑——他把最深情的文字给了晴雯，而袭人只得到一句「谁知公子无缘」的叹息。\",\"stance_type\":\"pro_moral\",\"fact_type\":\"text_inference\",\"confidence\":74,\"source_ids\":[\"source_ch19_xiren_persuade\",\"source_ch31_si_shanzi\",\"source_ch78_furong_lei\"]},{\"id\":\"viewpoint_xiren_qingwen_readers\",\"title\":\"读者论：二百年来的「袭晴之争」是《红楼梦》接受史的核心战场\",\"summary\":\"读者对袭人与晴雯的评价分歧，本质上是对「世俗成功学」与「浪漫本真论」两种价值观的站队。\",\"argument_body\":\"袭晴之争的历史：清代评点家（王希廉等）多褒袭贬晴——袭人「贤德」，晴雯「轻浮」；五四以后（俞平伯、鲁迅时代）风向逆转——晴雯的「不屈服」被塑造为反封建象征，袭人则被斥为「告密者」；当代阅读更趋多元：袭人的「难处」（既要保护宝玉又要自保）与晴雯的「盲区」（不懂权力游戏）都被重新审视。这个争论的持久性说明：二人已经不是人物，而是「命题」——袭人代表「顺应体制能否保全自己」（答案：不能，她终究「公子无缘」）；晴雯代表「对抗体制能否保全自己」（答案：也不能，她「寿夭多因毁谤生」）。两种策略都失败了——这才是曹雪芹最深的悲观：在封建制度下，顺从与反抗殊途同归，唯有「情」本身（宝玉的悼念）在废墟上幸存。\",\"stance_type\":\"neutral_analysis\",\"fact_type\":\"scholarly_viewpoint\",\"confidence\":70,\"source_ids\":[\"source_ch05_xiren_judgment\",\"source_ch05_qingwen_judgment\"]}]},{\"id\":\"question_wangfuren_trusts_xiren\",\"title\":\"王夫人为什么更信任袭人而不是晴雯？\",\"heat_weight\":68,\"viewpoints\":[{\"id\":\"viewpoint_xiren_trust_values\",\"title\":\"价值观论：王夫人信任的是「与自己同构的人」\",\"summary\":\"袭人向王夫人进言「男女之防」正中其核心焦虑——二人共享同一套礼教价值观，信任因此建立。\",\"argument_body\":\"第三十四回是转折点：宝玉挨打后，王夫人找袭人问话，袭人主动进言「怎么变个法儿，以后竟还教二爷搬出园外来住就好了」——她担心的是「园内人多口杂，日后倘或有些别的事，或者有那等不知廉耻的，做出什么不才之事来，反连累着二爷的名声」。这段话的杀伤力在于它精确复述了王夫人最大的恐惧（宝玉名声受损），并提供了解决方案（搬出园子）。王夫人的反应是「如雷轰电掣的一般」——她当场感慨「我的儿，你竟有这个心胸，想的这样周全！……难为你成全我娘儿两个声名体面」。第三十六回她便提升袭人月钱至二两银子一吊钱（姨娘的待遇），并说「把他交给你，好歹留心，保全了他，就是保全了我」。信任的本质在此显形：王夫人信任的不是袭人这个人，而是袭人对「礼教秩序」的忠诚——这种忠诚与她自己管理贾府的方式完全同构。\",\"stance_type\":\"pro_values\",\"fact_type\":\"text_inference\",\"confidence\":78,\"source_ids\":[\"source_ch34_xiren_jinyan\",\"source_ch36_xiren_promote\"]},{\"id\":\"viewpoint_qingwen_threat\",\"title\":\"威胁论：晴雯的「美而自由」是王夫人最深的威胁\",\"summary\":\"晴雯的每一个特质（美貌、口才、独立性、像黛玉）都触发了王夫人对「狐狸精」的原型恐惧。\",\"argument_body\":\"王夫人驱逐晴雯时的核心指控是「我看不上这浪样儿！谁许你这样花红柳绿的妆扮！」——注意：晴雯的「罪状」不是事实（她与宝玉毫无私情），而是「样子」：她长得像黛玉（美）、不打扮就「水蛇腰削肩膀」（天然的风流体态）、说话爽利（不像袭人那样「沉重」）。在王夫人的认知体系中，「美」+「不驯服」=「勾引」——这个等式不需要证据，只需要直觉。更深一层：晴雯是贾母的人（贾母说「我的意思这些丫头的模样爽利言谈针线多不及他，将来只他还可以给宝玉使唤得」）——驱逐晴雯也是王夫人与贾母之间「宝玉身边人事权」的较量。王夫人选袭人弃晴雯，既是价值观选择，也是权力宣告：宝玉的未来由她（而非贾母）定义。\",\"stance_type\":\"pro_threat\",\"fact_type\":\"scholarly_viewpoint\",\"confidence\":74,\"source_ids\":[\"source_ch74_wangfuren_qingwen\",\"source_ch78_jiamu_qingwen\",\"source_ch77_qingwen_expelled\"]},{\"id\":\"viewpoint_xiren_trust_utilitarian\",\"title\":\"实用论：王夫人需要的是「管理者」而非「美人」\",\"summary\":\"王夫人的选择本质是管理逻辑：袭人是「能用的人」（能管束、能通风报信、能维持秩序），晴雯是「失控的人」。\",\"argument_body\":\"王夫人的用人标准在全书极为一致：她需要的是「能把宝玉管住的人」。金钏因一句轻浮话被逐（说明她不能容忍「轻浮型」），袭人因一次进言被提拔（说明她奖赏「规劝型」）。从管理角度看：袭人提供的是「控制功能」——她劝宝玉、盯下人、向王夫人汇报动态（无论是否「告密」，客观上她是王夫人在怡红院的信息节点）；晴雯提供的是「不稳定因素」——她挑动是非（骂小红、顶撞王善保家的）、纵容宝玉、且不受任何人的管束。一个要「保全儿子声名」的母亲，在「控制型丫鬟」与「自由型丫鬟」之间选择前者，是必然的。王夫人的悲剧在于：她需要的「管理者」最终也没能管住宝玉（宝玉出家），而那个「失控者」反而让宝玉最接近「人性」——她的管理逻辑与宝玉的人性逻辑，从第三十六回（信任袭人）到第七十七回（驱逐晴雯），始终在互相摧毁。\",\"stance_type\":\"neutral_analysis\",\"fact_type\":\"text_inference\",\"confidence\":72,\"source_ids\":[\"source_ch36_xiren_promote\",\"source_ch74_wangfuren_qingwen\"]}]}]}]}]\nb:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n11:I[27201,[\"/honglou-yuzhou/_next/static/chunks/3hkbun0grg2v7.js\",\"/honglou-yuzhou/_next/static/chunks/19dj7h0a4hfs2.js\"],\"IconMark\"]\n8:null\nd:[[\"$\",\"title\",\"0\",{\"children\":\"晴雯 · 红楼宇宙\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"宝玉身边最「风流灵巧」的丫鬟，也是被冤枉而死的烈性女儿。\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/honglou-yuzhou/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L11\",\"3\",{}]]\n"])</script></body></html>
